apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskforge
  template:
    metadata:
      labels:
        app: taskforge
    spec:
      containers:
        - name: taskforge
          image: taskforge:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: taskforge-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: taskforge
spec:
  selector:
    app: taskforge
  ports:
    - port: 80
      targetPort: 8080